name: "Windows Build"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'

jobs:
  build_windows:
    name: 'Windows build'
    runs-on: windows-latest

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress --force

          $candidateRoots = @(
            "$env:ProgramFiles\WiX Toolset*",
            "$env:ProgramFiles(x86)\WiX Toolset*"
          )

          $wixRoot = $null
          foreach ($candidate in $candidateRoots) {
            if (Test-Path $candidate) {
              $wixRoot = (Get-ChildItem $candidate -Directory | Select-Object -First 1 -ExpandProperty FullName)
              break
            }
          }

          if (-not $wixRoot) {
            throw "WiX Toolset was not installed"
          }

          $wixBin = Join-Path $wixRoot "bin"
          if (-not (Test-Path (Join-Path $wixBin "light.exe"))) {
            throw "WiX Toolset binaries were not found"
          }

          Add-Content $env:GITHUB_PATH $wixBin

      - name: Configure Gradle cache directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-cache"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-cache" >> "$GITHUB_ENV"

      - name: "Build MSI"
        run: .\gradlew.bat createMsi -x checkstyleMain -x checkstyleTest

      - name: "Build self-contained archive for Windows"
        run: .\gradlew.bat createWindowsPortableZip -x checkstyleMain -x checkstyleTest

      - name: "Upload Windows MSI"
        uses: actions/upload-artifact@v7
        if: success()
        with:
          path: build/dist/*.msi
          name: logisim-evolution-windows-msi

      - name: "Upload Windows Portable ZIP"
        uses: actions/upload-artifact@v7
        if: success()
        with:
          path: build/dist/*.zip
          name: logisim-evolution-windows-portable-zip

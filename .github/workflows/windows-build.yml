name: "Windows Build"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'

jobs:
  build_windows:
    name: 'Windows build'
    runs-on: windows-latest

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}  
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress

          $wixRoot = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset'
          if (Test-Path $wixRoot) {
            $versionDirs = Get-ChildItem -Path $wixRoot -Directory | Sort-Object Name -Descending
            foreach ($dir in $versionDirs) {
              $binDir = Join-Path $dir.FullName 'bin'
              if (Test-Path $binDir) {
                Add-Content -Path $env:GITHUB_PATH -Value $binDir
                break
              }
            }
          }

      - name: Verify JDK and jpackage
        shell: pwsh
        run: |
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Get-Command java
          if (Test-Path "$env:JAVA_HOME\bin\jpackage.exe") {
            & "$env:JAVA_HOME\bin\jpackage.exe" --version
          } else {
            Write-Error "jpackage.exe not found under JAVA_HOME"
          }

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: "Build MSI"
        run: .\gradlew.bat createMsi -x checkstyleMain -x checkstyleTest

      - name: "Build self-contained archive for Windows"
        run: .\gradlew.bat createWindowsPortableZip -x checkstyleMain -x checkstyleTest

      - name: "Upload Windows MSI"
        uses: actions/upload-artifact@v7
        if: success()
        with:
          path: build/dist/*.msi
          name: logisim-evolution-windows-msi

      - name: "Upload Windows Portable ZIP"
        uses: actions/upload-artifact@v7
        if: success()
        with:
          path: build/dist/*.zip
          name: logisim-evolution-windows-portable-zip
